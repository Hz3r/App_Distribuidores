name: CI

# Se ejecuta en cada PR y en cada push a main.
# No usa claves reales: compila con env/dev.example.json (valores vacíos).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Analyze, test y build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Instala la versión fijada en .fvmrc (una sola fuente de verdad).
      - name: Leer versión de Flutter
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Instalar Flutter ${{ steps.fvm.outputs.version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Resolver workspace
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed apps packages

      - name: Analyze
        run: dart run melos run analyze

      - name: Generar código
        run: dart run melos run gen

      - name: Tests
        run: dart run melos run test

      - name: Build web del panel (con entorno de ejemplo)
        working-directory: apps/panel_web
        run: flutter build web --dart-define-from-file=../../env/dev.example.json

  sql:
    name: Pruebas SQL (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Migraciones, pruebas SQL y carga del seed. psql viene en ubuntu-latest.
      - name: Pruebas SQL
        run: bash supabase/tests/run.sh
