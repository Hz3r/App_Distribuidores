# Workspace raíz del monorepo (Dart pub workspaces).
# Las apps y paquetes se resuelven juntos desde aquí: `melos bootstrap` o `flutter pub get` en la raíz.
name: app_distribuidores_workspace
description: "Monorepo: app móvil, panel web y paquete core del SaaS de pedidos B2B."
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - apps/app_movil
  - apps/panel_web
  - packages/core

dev_dependencies:
  melos: ^8.10.1

# Configuración de Melos 8 (workspace). Los paquetes salen del bloque `workspace:`.
melos:
  scripts:
    analyze:
      exec: flutter analyze
      description: Analiza todos los paquetes (0 errores y 0 warnings requeridos).

    format:
      run: dart format --output=none --set-exit-if-changed apps packages
      description: Verifica el formato sin modificar archivos. Para aplicar, usa `dart format apps packages`.

    test:
      exec: flutter test
      packageFilters:
        dirExists: test
      description: Corre los tests de cada paquete que tenga carpeta test/.

    gen:
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner
      description: Genera código de freezed, json_serializable y riverpod.

    run:movil:
      exec: flutter run --dart-define-from-file=../../env/dev.json
      packageFilters:
        scope: app_movil
      description: Ejecuta la app móvil con el entorno DEV.

    run:web:
      exec: flutter run -d chrome --dart-define-from-file=../../env/dev.json
      packageFilters:
        scope: panel_web
      description: Ejecuta el panel web con el entorno DEV.

    db:reset:
      run: supabase db reset
      description: Reinicia la base local de Supabase (requiere Supabase CLI y Docker).
